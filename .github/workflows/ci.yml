name: CI

# Every PR (design/loop/spec.md, step 2).
on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make app-install
      - run: make check

      # A PR that so far changes only the sources and the card modules
      # generated from them (design/loop/spec.md, step 2): the app's tests are
      # expected to fail until the loop's code commits land, so it skips them.
      - name: Does this PR change only the sources?
        id: layer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          other=$(git diff --name-only "$BASE...$HEAD" | grep -vxE 'rulebook\.md|cards\.yaml|tools/cards\.js|app/src/content/cards\.generated\.ts' || true)
          if [ -z "$other" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            echo "Only the sources and their generated card modules changed: skipping make app-check."
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.layer.outputs.source != 'true'
        run: make app-check
