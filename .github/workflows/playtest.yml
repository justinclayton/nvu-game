# Step 6 of the design loop (design/loop/spec.md): the agent playtest. A
# `playtest` label on a source PR runs an agent that plays one run through
# bin/nvu on the PR's branch, source-blind, and writes a note. The job commits
# the note and its run file to the branch and posts the report as a comment on
# the PR, all as nvu-agent (NVU_AGENT_APP_ID, NVU_AGENT_PRIVATE_KEY). The label
# comes off when the job ends, so adding it again asks for another run. The
# agent has no token: Bash for bin/nvu, reading, and Write under
# design/playtests/. Every report carries <!-- nvu-loop: playtest <sha> -->,
# naming the note's commit, and the run number is one more than the reports
# already on the PR. A fresh App token is minted before each write, because a
# token lasts an hour and a run can last longer.
name: Playtest

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: playtest-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  playtest:
    # The fork guard: a pull request from a fork never reaches the runner.
    if: github.event.label.name == 'playtest' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the branch's head as it is now
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mint the nvu-agent token
        id: agent-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NVU_AGENT_APP_ID }}
          private-key: ${{ secrets.NVU_AGENT_PRIVATE_KEY }}

      - name: Find the run number and the seed
        id: seed
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
        run: |
          set -eu
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[].body' \
            | grep -c '<!-- nvu-loop: playtest [0-9a-f]\{40\} -->' || true)
          echo "run=$((runs + 1))" >> "$GITHUB_OUTPUT"
          echo "seed=$((PR * 100 + runs + 1))" >> "$GITHUB_OUTPUT"
          echo "Run $((runs + 1)), seed $((PR * 100 + runs + 1))."

      - name: Write the prompt
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          {
            cat .github/loop/playtest.md
            echo
            echo "## This run"
            echo
            echo "- The seed: $SEED"
            echo "- The branch is \`$BRANCH\`, at \`$SHA\`."
            echo "- Write the note under \`design/playtests/\`."
          } > "$RUNNER_TEMP/prompt.md"

      - name: Say the playtest has started
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          # shellcheck disable=SC2016
          printf 'Playtest started on `%s` at `%s`, seed %s. [Run](%s)\n\n<!-- nvu-loop: playtest-start %s -->\n' \
            "$BRANCH" "${SHA:0:7}" "$SEED" "$RUN" "$SHA" > "$RUNNER_TEMP/playtest-start.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@"$RUNNER_TEMP/playtest-start.md" --jq '"posted \(.html_url)"'

      - name: Playtest
        run: |
          set -o pipefail
          claude -p \
            --model sonnet \
            --restricted \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --tools Bash,Read,Grep,Glob,Write \
            --allowedTools \
              'Read(./**)' 'Grep(./**)' 'Glob(./**)' 'Edit(design/playtests/**)' \
              'Bash(bin/nvu:*)' \
            --disallowedTools \
              'Read(design/loop/**)' 'Grep(design/loop/**)' 'Glob(design/loop/**)' \
              'Read(app/src/**)' 'Grep(app/src/**)' 'Glob(app/src/**)' \
              'Read(//**/design/loop/**)' 'Grep(//**/design/loop/**)' 'Glob(//**/design/loop/**)' \
              'Read(//**/app/src/**)' 'Grep(//**/app/src/**)' 'Glob(//**/app/src/**)' \
            --output-format stream-json \
            --verbose \
            < "$RUNNER_TEMP/prompt.md" \
            | tee "$RUNNER_TEMP/transcript.jsonl" \
            | jq -R -r --unbuffered -f .github/loop/progress.jq

      - name: Check the agent wrote only the note
        id: note
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          set -eu
          result=$(jq -r 'select(.type == "result") | select(.subtype == "success" and (.is_error | not)) | .result' "$RUNNER_TEMP/transcript.jsonl")
          if [ -z "$result" ]; then
            echo "The playtester did not finish. The transcript is on the run."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "The playtester moved HEAD."
            exit 1
          fi
          changes=$(git status --porcelain -uall)
          if [ -z "$changes" ]; then
            echo "The playtester wrote no note. Its message: $result"
            exit 1
          fi
          if [ "$(echo "$changes" | wc -l)" -ne 1 ] || ! echo "$changes" | grep -qE '^\?\? design/playtests/[^/]+\.md$'; then
            echo "$changes"
            echo "The playtester may write one new note under design/playtests/ and nothing else."
            exit 1
          fi
          md=$(echo "$changes" | cut -c4-)
          test -f "runs/$SEED.json"
          cp "runs/$SEED.json" "${md%.md}.json"
          echo "md=$md" >> "$GITHUB_OUTPUT"

      - name: Replay the new run
        working-directory: app
        run: npx vitest run src/cli/playtests.test.ts

      - name: Mint the nvu-agent token for the commit
        id: commit-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NVU_AGENT_APP_ID }}
          private-key: ${{ secrets.NVU_AGENT_PRIVATE_KEY }}

      - name: Commit the note to the branch
        id: commit
        env:
          TOKEN: ${{ steps.commit-token.outputs.token }}
          BOT_SLUG: ${{ steps.commit-token.outputs.app-slug }}[bot]
          MD: ${{ steps.note.outputs.md }}
          GH_TOKEN: ${{ steps.commit-token.outputs.token }}
        run: |
          set -eu
          id=$(gh api "users/$BOT_SLUG" --jq .id)
          git config user.name "$BOT_SLUG"
          git config user.email "$id+$BOT_SLUG@users.noreply.github.com"
          git add "$MD" "${MD%.md}.json"
          git commit -q -m "Playtest: $(basename "$MD" .md)"
          git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$BRANCH"
          echo "final=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mint the nvu-agent token for the report
        id: report-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NVU_AGENT_APP_ID }}
          private-key: ${{ secrets.NVU_AGENT_PRIVATE_KEY }}

      - name: Post the report on the PR
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          RUN_COUNT: ${{ steps.seed.outputs.run }}
          SEED: ${{ steps.seed.outputs.seed }}
          MD: ${{ steps.note.outputs.md }}
          FINAL: ${{ steps.commit.outputs.final }}
        run: |
          set -eu
          kit=$(sh tools/kit-revision.sh)
          outcome=$(jq -r .outcome "${MD%.md}.json")
          sections=$(awk '/^## (What the run showed|Candidate issues)$/ {p=1; sub(/^## /, "### "); print; next} /^## / {p=0} p' "$MD")
          if [ -z "$sections" ]; then
            echo "$MD has no What the run showed or Candidate issues section."
            exit 1
          fi
          # shellcheck disable=SC2016
          printf 'Playtest run %s: kit revision `%s`, seed %s, outcome %s. [Note](%s/%s/blob/%s/%s)\n\n%s\n\n<!-- nvu-loop: playtest %s -->\n' \
            "$RUN_COUNT" "$kit" "$SEED" "$outcome" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$FINAL" "$MD" "$sections" "$FINAL" \
            > "$RUNNER_TEMP/report.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@"$RUNNER_TEMP/report.md" --jq '"posted \(.html_url)"'

      - name: Mint the nvu-agent token to close out
        id: final-token
        if: always()
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NVU_AGENT_APP_ID }}
          private-key: ${{ secrets.NVU_AGENT_PRIVATE_KEY }}

      - name: Say the playtest failed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          printf 'The playtest of `%s` failed before its report was posted. Add the `playtest` label again to retry; the transcript is on the [run](%s).\n' "${SHA:0:7}" "$RUN" \
            > "$RUNNER_TEMP/playtest-failed.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@"$RUNNER_TEMP/playtest-failed.md" --jq '"posted \(.html_url)"'

      - name: Take the label off
        if: always() && steps.final-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/playtest" --silent

      - name: Keep the transcript on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcript.jsonl
          retention-days: 30
          if-no-files-found: ignore
