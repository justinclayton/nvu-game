name: Rules version

on:
  pull_request:
    branches: [main]

jobs:
  rules-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make bump-rules-version
      - name: Fail if the rulebook changed without a version bump
        run: |
          git diff --exit-code --stat || {
            echo "rulebook.md changed without a higher Rules version. Run: make bump-rules-version"
            exit 1
          }
