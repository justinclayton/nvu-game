name: Rules version

on:
  pull_request:
    branches: [main]

jobs:
  rules-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-rules-version.mjs
