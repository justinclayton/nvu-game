name: Kit revision

on:
  pull_request:
    branches: [main]

jobs:
  rules-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make bump-revision
      - name: Fail if a source changed without its counter raised
        run: |
          git diff --exit-code --stat || {
            echo "rulebook.md or cards.yaml changed without R or C raised. Run: make bump-revision"
            exit 1
          }
