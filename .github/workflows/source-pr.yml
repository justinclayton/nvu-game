# Step 2 of the design loop (design/loop/spec.md): a push to a branch whose
# rulebook.md or cards.yaml differ from main gets a draft PR to main if none is
# open for the branch. That branch is the source layer, the bottom of the
# loop's stack. A branch built on another open branch is a layer above it,
# whose PR gh stack opens against the layer below, so it gets none here.
# Nothing here runs an agent; it is a GitHub write, so the self-hosted runner
# is not needed.
#
# Opened as the nvu-bot GitHub App (variable NVU_BOT_APP_ID, secret
# NVU_BOT_PRIVATE_KEY), because a PR opened with the workflow's own
# GITHUB_TOKEN does not start the pull_request workflows (CI, Kit revision)
# until the next push. There is no fallback: a job whose app is not
# configured fails.
name: Source layer PR

on:
  push:
    branches-ignore:
      - main
      - pr-media

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: source-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did a source change since main?
        id: sources
        run: |
          git fetch --quiet origin main
          if git diff --quiet origin/main...HEAD -- rulebook.md cards.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "rulebook.md and cards.yaml match main"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is this a layer above another branch?
        id: layer
        if: steps.sources.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # A layer contains the tip of another branch that main does not.
          below=
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            case "$ref" in origin/HEAD|origin|origin/main|origin/pr-media|"origin/$BRANCH") continue ;; esac
            [ "$(git rev-parse "$ref")" = "$(git rev-parse HEAD)" ] && continue
            git merge-base --is-ancestor "$ref" origin/main && continue
            if git merge-base --is-ancestor "$ref" HEAD; then below=$ref; break; fi
          done
          if [ -n "$below" ]; then
            echo "layer=true" >> "$GITHUB_OUTPUT"
            echo "$BRANCH is built on ${below#origin/}"
          else
            echo "layer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the nvu-bot token
        id: app-token
        if: steps.sources.outputs.changed == 'true' && steps.layer.outputs.layer == 'false'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NVU_BOT_APP_ID }}
          private-key: ${{ secrets.NVU_BOT_PRIVATE_KEY }}

      - name: Open the source layer's draft PR if none is open
        if: steps.sources.outputs.changed == 'true' && steps.layer.outputs.layer == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a PR is already open for $BRANCH"
            exit 0
          fi
          kit=$(sh tools/kit-revision.sh)
          subject=$(git log -1 --format=%s origin/main..HEAD -- rulebook.md cards.yaml)
          {
            echo "<!-- nvu-loop: source-pr -->"
            echo "Draft PR for \`$BRANCH\`."
            echo
            echo "Kit revision at opening: \`$kit\`."
            echo
            echo "Sources changed since \`main\`:"
            echo
            echo '```'
            git diff --stat origin/main...HEAD -- rulebook.md cards.yaml
            echo '```'
            echo
          } > pr-body.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="Kit $kit: $subject" \
            -f head="$BRANCH" \
            -f base=main \
            -F draft=true \
            -F body=@pr-body.md \
            --jq '"opened draft PR #\(.number): \(.html_url)"'
