---
# North vs Up — card list
#
# Everything that shows a card should read this file.
#
#   node tools/cards.mjs build    regenerates prototype/cards.js (used by `prototype/card-sheet.html`,
#                                 the simulator, and sim-sweep.js
#   node tools/cards.mjs check    fails if cards.js is stale, or if a prototype
#                                 stops rendering the whole list
#
# Change a card HERE, then run build. Never edit prototype/cards.js. Never
# hand-write a card into a prototype.
#
# Fields
#   set     official | proposed
#   kind    player | good_stuff | bad_stuff | enemy_room | hazard_room | stuff_room
#   owner   Red | Gray           player cards only
#   rarity  Fine | Cool | Woah   omitted entirely for bad_stuff and all rooms
#   cost    integer              every card prints one; null means not yet set
#   power / scramble  integer    omitted when the card has no printed stat
#   conditional_stat  true       stat lives in the text instead of a field
#   hold    true                 the card's effect runs while it sits in hand
#   starter true                 part of a starting deck rather than a reward pool
#   text    string               the literal printed rules text
#
# Stuff exhausts like any other card, to the pile of whoever spent it. At
# ascension, Stuff in the exhaust piles moves to the Scrapyard for good unless
# the Scrap tax saves it (rulebook sections 7 and 10). No Stuff card restates it.

