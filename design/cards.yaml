---
# North vs Up — card list
#
# Everything that shows a card should read this file. Change a card HERE, then run build.
#
#   node tools/cards.mjs build    regenerates tools/cards.js (used by tools/card-sheet.html, the
#                                 print-and-cut sheet) and app/src/content/cards.generated.ts
#   node tools/cards.mjs check    fails if either generated module is stale, or if the card
#                                 sheet stops printing the whole list
#
#
# Fields
#   set     official | proposed
#   kind    player | good_stuff | bad_stuff | room | stairwell
#   owner   Red | Gray           player cards only
#   rarity  Fine | Cool | Woah
#   cost    integer              null means not yet set
#   oomph / scramble  integer
#   conditional_stat  true       stat lives in the text instead of a field
#   starter true                 part of a starting deck rather than a reward pool
#   text    string               the literal printed rules text
#   band    1 | 2 | 3            room and stairwell only: which floors' pool the card is drawn from
#   challenges                   room and stairwell only: one or more, each a list of
#                                `thresholds` (stat, value, outcome) in printed order
#   flee    string               room and stairwell only: the printed Flee line
#   flavor  string               room and stairwell only: the printed flavor line, empty for now

