<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>North vs Up — the card sheet (print &amp; cut)</title>
<style>
  :root {
    --fine: #0fa3a8;   /* robin egg blue */
    --cool: #8f6fc4;   /* lavender */
    --woah: #daa520;   /* goldenrod */
    --none: #111;
    --red-owner: #b52d24;
    --gray-owner: #7a7f87;
    --good-stuff: #3f8f4a;  /* green */
    --bad-stuff: #5a3a6e;   /* dark plum */
    --floor: #111;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 12mm;
    color: #111;
    background: #fff;
  }
  h1 { font-size: 16pt; margin: 0 0 2mm; }
  h2 {
    font-size: 10pt; text-transform: uppercase; letter-spacing: .08em;
    color: #555; margin: 8mm 0 3mm; border-bottom: 1px solid #ccc; padding-bottom: 1mm;
  }
  .sheet { display: flex; flex-wrap: wrap; gap: 4mm; }

  .card {
    width: 63mm; height: 88mm;
    border: 0.4mm solid #000;
    border-radius: 3mm;
    padding: 3mm;
    display: flex; flex-direction: column;
    page-break-inside: avoid; break-inside: avoid;
    position: relative;
  }

  /* The bar across the top is the card's type: Red, Gray, Good Stuff, Bad Stuff, or Floor. */
  .type-bar { height: 2mm; border-radius: 1mm; margin: -1mm -1mm 2mm; background: var(--floor); }
  .owner-red .type-bar { background: var(--red-owner); }
  .owner-gray .type-bar { background: var(--gray-owner); }
  .kind-good_stuff .type-bar { background: var(--good-stuff); }
  .kind-bad_stuff .type-bar { background: var(--bad-stuff); }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2mm; }
  .name { font-size: 11pt; font-weight: 700; line-height: 1.1; }
  .cost {
    flex: 0 0 auto;
    font-size: 12pt; font-weight: 700;
    border: 0.4mm solid #222; border-radius: 50%;
    width: 8mm; height: 8mm;
    display: flex; align-items: center; justify-content: center;
  }
  .typeline {
    font-size: 8pt; text-transform: uppercase; letter-spacing: .06em;
    color: #333; margin-top: 1mm; font-weight: 600;
  }
  .art {
    flex: 1 1 auto; margin: 2mm 0;
    border: 0.3mm dashed #bbb; border-radius: 1.5mm;
    display: flex; align-items: center; justify-content: center;
    color: #bbb; font-size: 8pt; letter-spacing: .1em;
    min-height: 18mm;
  }
  .stat {
    font-size: 12pt; font-weight: 700; margin-bottom: 1.5mm;
  }
  .text { font-size: 8.5pt; line-height: 1.35; }
  .text em { color: #444; }
  .hold {
    font-size: 8pt; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 1.5mm;
  }
  .rarity-word {
    position: absolute; bottom: 2mm; right: 3mm;
    font-size: 7pt; letter-spacing: .1em; text-transform: uppercase; color: #999;
  }

  /* room cards */
  .card.room .type-bar { background: var(--floor); }
  .thresholds { font-size: 9pt; line-height: 1.4; }
  .thresholds .th { margin-bottom: 1.5mm; }
  .thresholds .th b { font-weight: 700; }
  .flee {
    margin-top: auto; padding-top: 2mm; border-top: 0.3mm solid #999;
    font-size: 8.5pt; line-height: 1.3;
  }
  .flee b { text-transform: uppercase; letter-spacing: .06em; font-size: 8pt; }

  @media print {
    body { margin: 8mm; }
  }
</style>
</head>
<body>

<h1>North vs Up — the card list (print &amp; cut)</h1>
<div id="sheets"></div>

<script src="cards.js"></script>
<script>
"use strict";

function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
  });
}

var TYPE_LINE = {
  good_stuff: "Good Stuff",
  bad_stuff: "Bad Stuff",
  enemy_room: "Enemy",
  hazard_room: "Hazard",
  stuff_room: "Stuff"
};

function statLine(c) {
  var parts = [];
  if (c.power) parts.push("Power " + c.power);
  if (c.scramble) parts.push("Scramble " + c.scramble);
  if (parts.length) return '<div class="stat">' + parts.join(", ") + "</div>";
  return "";
}

/* The YAML holds a card's text as one string; the sheet wants its clauses as
   separate paragraphs, which is how they are printed. */
function textBlock(c) {
  if (!c.text) return "";
  var clauses = c.text.split(/(?<=\.)\s+(?=[A-Z])/);
  return '<div class="text">' + clauses.map(esc).join("<br><br>") + "</div>";
}

function costPip(c) {
  if (c.cost === null || c.cost === undefined) return '<div class="cost">?</div>';
  return '<div class="cost">' + c.cost + "</div>";
}

function playerCardHTML(c) {
  var rarityClass = c.rarity ? c.rarity.toLowerCase() : "norarity";
  var ownerClass = c.owner === "Red" ? "owner-red"
    : c.owner === "Gray" ? "owner-gray" : "owner-neutral";
  return '<div class="card ' + rarityClass + " " + ownerClass + " kind-" + c.kind + '"><div class="type-bar"></div>' +
    '<div class="top"><div><div class="name">' + esc(c.name) + "</div>" +
    '<div class="typeline">' + esc(c.owner || TYPE_LINE[c.kind]) + "</div></div>" +
    costPip(c) + "</div>" +
    '<div class="art"></div>' +
    (c.hold ? '<div class="hold">Hold</div>' : "") +
    statLine(c) +
    textBlock(c) +
    (c.rarity ? '<div class="rarity-word">' + esc(c.rarity) + "</div>" : "") +
    "</div>";
}

function roomCardHTML(c) {
  var lines = (c.thresholds || []).map(function (t) {
    return '<div class="th"><b>' + esc(t.stat) + " " + t.value + ":</b> " + esc(t.outcome) + "</div>";
  }).join("");
  var foot = c.flee
    ? '<div class="flee"><b>Flee:</b> ' + esc(c.flee) + "</div>"
    : '<div class="flee"><b>Flee:</b> Leave empty handed.</div>';
  return '<div class="card room"><div class="type-bar"></div>' +
    '<div class="top"><div><div class="name">' + esc(c.name) + "</div>" +
    '<div class="typeline">' + esc(TYPE_LINE[c.kind]) + "</div></div></div>" +
    '<div class="art"></div>' +
    '<div class="thresholds">' + lines + "</div>" + foot + "</div>";
}

function cardHTML(c) {
  return c.kind.indexOf("room") !== -1 ? roomCardHTML(c) : playerCardHTML(c);
}

/* The sheet's sections, in cutting order. Each is a filter over the one list. */
function player(owner, starter) {
  return function (c) {
    return c.kind === "player" && c.owner === owner && Boolean(c.starter) === starter;
  };
}
function kind(k) {
  return function (c) { return c.kind === k; };
}
function rooms(c) {
  return c.kind === "enemy_room" || c.kind === "hazard_room";
}
function rewards(c) {
  return c.kind === "player" && !c.starter;
}

var SECTIONS = [
  { h: "Red — starters", pick: player("Red", true) },
  { h: "Gray — starters", pick: player("Gray", true) },
  { h: "Red — rewards", pick: function (c) { return rewards(c) && c.owner === "Red"; } },
  { h: "Gray — rewards", pick: function (c) { return rewards(c) && c.owner === "Gray"; } },
  { h: "Good Stuff", pick: kind("good_stuff") },
  { h: "Bad Stuff", pick: kind("bad_stuff") },
  { h: "Rooms", pick: rooms },
  { h: "Stuff rooms", pick: kind("stuff_room") }
];

(function render() {
  var out = "", seen = 0;
  SECTIONS.forEach(function (s) {
    var cards = NVU_CARDS.cards.filter(s.pick);
    if (!cards.length) return;
    seen += cards.length;
    out += "<h2>" + esc(s.h) + " <span style='font-weight:400;text-transform:none;letter-spacing:0'>(" +
      cards.length + ")</span></h2>";
    out += '<div class="sheet">' + cards.map(cardHTML).join("") + "</div>";
  });
  document.getElementById("sheets").innerHTML = out;

  /* Loud, on the page, if a card in the list reaches no section. */
  if (seen !== NVU_CARDS.cards.length) {
    var missed = NVU_CARDS.cards.filter(function (c) {
      return !SECTIONS.some(function (s) { return s.pick(c); });
    }).map(function (c) { return c.name; });
    document.getElementById("sheets").insertAdjacentHTML("afterbegin",
      "<h2 style=\"color:#b00\">" + missed.length +
      " card(s) on no section: " + esc(missed.join(", ")) + "</h2>");
  }
})();
</script>

</body>
</html>
