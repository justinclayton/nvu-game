<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>North vs Up — the card sheet (print &amp; cut)</title>
<style>
  :root {
    --fine: #0fa3a8;   /* robin egg blue */
    --cool: #8f6fc4;   /* lavender */
    --woah: #daa520;   /* goldenrod */
    --none: #111;
    --red-owner: #b52d24;
    --gray-owner: #7a7f87;
    --good-stuff: #3f8f4a;  /* green */
    --bad-stuff: #5a3a6e;   /* dark plum */
    --floor: #111;
    --band-1: #2d6a4f;  /* forest green: floors 1-3 */
    --band-2: #1d4e89;  /* deep blue: floors 4-6 */
    --band-3: #7c2d12;  /* rust: floors 7-9 */
    --oomph: #b52d24;
    --scramble: #4a6a9a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 12mm;
    color: #111;
    background: #fff;
  }
  .sheet { display: flex; flex-wrap: wrap; gap: 4mm; }

  .card {
    width: 63mm; height: 88mm;
    border: 0.4mm solid #000;
    border-radius: 3mm;
    padding: 3mm;
    display: flex; flex-direction: column;
    page-break-inside: avoid; break-inside: avoid;
    position: relative;
  }

  /* The bar across the top is the card's type: Red, Gray, Good Stuff, Bad Stuff, or Floor. */
  .type-bar { height: 2mm; border-radius: 1mm; margin: -1mm -1mm 2mm; background: var(--floor); }
  .owner-red .type-bar { background: var(--red-owner); }
  .owner-gray .type-bar { background: var(--gray-owner); }
  .kind-good_stuff .type-bar { background: var(--good-stuff); }
  .kind-bad_stuff .type-bar { background: var(--bad-stuff); }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2mm; }
  .name { font-size: 11pt; font-weight: 700; line-height: 1.1; }
  .cost {
    flex: 0 0 auto;
    font-size: 12pt; font-weight: 700;
    border: 0.4mm solid #222; border-radius: 50%;
    width: 8mm; height: 8mm;
    display: flex; align-items: center; justify-content: center;
  }
  .typeline {
    font-size: 8pt; text-transform: uppercase; letter-spacing: .06em;
    color: #333; margin-top: 1mm; font-weight: 600;
  }
  .stats { display: flex; gap: 2mm; margin: 2.5mm 0 2mm; }
  .stats .s { flex: 1; border: 0.5mm solid; border-radius: 1.5mm; padding: 1.2mm 0 1mm; text-align: center; }
  .stats .s.oomph { border-color: var(--oomph); color: var(--oomph); }
  .stats .s.scramble { border-color: var(--scramble); color: var(--scramble); }
  .stats .s .n { font-size: 20pt; font-weight: 800; line-height: 1; }
  .stats .s .l { font-size: 6.5pt; letter-spacing: .12em; text-transform: uppercase; margin-top: .8mm; }
  .stats .s.cond .n { font-size: 14pt; }
  .text { font-size: 9.5pt; line-height: 1.4; margin-top: 1.5mm; }
  .text p { margin: 0 0 1.5mm; }
  .foot { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 1.5mm; }
  .rarity-word { font-size: 7pt; letter-spacing: .1em; text-transform: uppercase; color: #999; }

  /* room cards */
  .card.room .type-bar { background: var(--floor); }
  .card.room.band-1 .type-bar { background: var(--band-1); }
  .card.room.band-2 .type-bar { background: var(--band-2); }
  .card.room.band-3 .type-bar { background: var(--band-3); }
  .flavor { margin: 1.5mm 0 2mm; font-size: 8.5pt; font-style: italic; color: #555; line-height: 1.35; }
  .thresholds .th { font-size: 9.5pt; line-height: 1.35; }
  /* Within a challenge only one threshold's outcome resolves (rulebook, Outcome). */
  .thresholds .or { font-size: 7.5pt; font-weight: 800; letter-spacing: .1em; color: #444; margin: .8mm 0; }
  .thresholds .th b.oomph { color: var(--oomph); }
  .thresholds .th b.scramble { color: var(--scramble); }
  /* A rule above and below each challenge: tiers of one test stay inside one block. */
  .challenge { padding: 1.5mm 0; border-top: 0.2mm dotted #999; }
  .challenge:last-child { border-bottom: 0.2mm dotted #999; }
  .flee {
    margin-top: auto; padding-top: 2mm; border-top: 0.3mm solid #999;
    font-size: 8.5pt; line-height: 1.3;
  }
  .flee .label { text-transform: uppercase; letter-spacing: .06em; font-size: 8pt; }

  @media print {
    body { margin: 8mm; }
  }
</style>
</head>
<body>

<div id="sheets"></div>

<script src="cards.js"></script>
<script>
"use strict";

function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
  });
}

var TYPE_LINE = {
  good_stuff: "Good Stuff",
  bad_stuff: "Bad Stuff"
};

var ROOM_KIND_LABEL = { room: "Room", stairwell: "Stairwell" };

/* Floors 1-3, 4-6, 7-9 (rulebook Setup, "Floor deck"). */
var BAND_FLOORS = { 1: "Floors 1–3", 2: "Floors 4–6", 3: "Floors 7–9" };

function roomTypeLine(c) {
  if (c.band === null) return ROOM_KIND_LABEL[c.kind] + " · Floor 10";
  return ROOM_KIND_LABEL[c.kind] + " · " + (BAND_FLOORS[c.band] || "?");
}

/* Keywords (rulebook, "Keywords") and the game's own nouns print bold. */
var KEYWORD = /\b(Play:|Holding:|[Ee]xhausts?|Scrap|Peek|[Dd]raws?|Good Stuff|Bad Stuff|Stuff|Oomph|Scramble|Turn Start|Cleanup|Cleared|Clear|Ascend|for free|card reward)(?![A-Za-z])/g;

function rich(s) {
  return esc(s).replace(KEYWORD, "<b>$1</b>");
}

/* A threshold prints one stat (`stat`/`value`) or both at once
   (`stats: { Oomph, Scramble }`, design/cards.yaml). */
function thresholdLabel(t) {
  if (t.stats) {
    return '<b class="oomph">Oomph ' + t.stats.Oomph + '</b> and <b class="scramble">Scramble ' + t.stats.Scramble + "</b>";
  }
  return '<b class="' + esc(t.stat).toLowerCase() + '">' + esc(t.stat) + " " + t.value + "</b>";
}

function statTile(cls, n, label) {
  return '<div class="s ' + cls + '"><div class="n">' + n + '</div><div class="l">' + label + "</div></div>";
}

/* A `conditional_stat` card's number is in its text; the tile shows which stat. */
function statBlock(c) {
  var tiles = "";
  if (c.conditional_stat) {
    var which = /Oomph/.test(c.text) ? "oomph" : "scramble";
    tiles += statTile("cond " + which, "\u2731", which);
  }
  if (c.oomph) tiles += statTile("oomph", c.oomph, "Oomph");
  if (c.scramble) tiles += statTile("scramble", c.scramble, "Scramble");
  return tiles ? '<div class="stats">' + tiles + "</div>" : "";
}

/* The YAML holds a card's text as one string; the sheet wants its clauses as
   separate paragraphs, which is how they are printed. */
function textBlock(c) {
  if (!c.text) return "";
  var clauses = c.text.split(/(?<=\.)\s+(?=[A-Z])/);
  return '<div class="text">' + clauses.map(function (s) { return "<p>" + rich(s) + "</p>"; }).join("") + "</div>";
}

function flavorBlock(c) {
  return c.flavor ? '<div class="flavor">' + esc(c.flavor) + "</div>" : "";
}

function costPip(c) {
  if (c.cost === null || c.cost === undefined) return '<div class="cost">?</div>';
  return '<div class="cost">' + c.cost + "</div>";
}

function playerCardHTML(c) {
  var rarityClass = c.rarity ? c.rarity.toLowerCase() : "norarity";
  var ownerClass = c.owner === "Red" ? "owner-red"
    : c.owner === "Gray" ? "owner-gray" : "owner-neutral";
  var ownerTypeLine = c.starter === true ? c.owner + " (Starter)" : c.owner
  return '<div class="card ' + rarityClass + " " + ownerClass + " kind-" + c.kind + '"><div class="type-bar"></div>' +
    '<div class="top"><div><div class="name">' + esc(c.name) + "</div>" +
    '<div class="typeline">' + esc(ownerTypeLine || TYPE_LINE[c.kind]) + "</div></div>" +
    costPip(c) + "</div>" +
    statBlock(c) +
    textBlock(c) +
    '<div class="foot">' + (c.rarity ? '<div class="rarity-word">' + esc(c.rarity) + "</div>" : "") + "</div>" +
    "</div>";
}

function roomCardHTML(c) {
  var challenges = (c.challenges || []).map(function (ch) {
    var lines = (ch.thresholds || []).map(function (t) {
      return '<div class="th">' + thresholdLabel(t) + ": " + rich(t.outcome) + "</div>";
    }).join('<div class="or">OR</div>');
    return '<div class="challenge">' + lines + "</div>";
  }).join("");
  var foot = '<div class="flee"><b class="label">Flee:</b> ' + rich(c.flee || "Leave empty handed.") + "</div>";
  return '<div class="card room band-' + (c.band === null ? "10" : c.band) + '"><div class="type-bar"></div>' +
    '<div class="top"><div><div class="name">' + esc(c.name) + "</div>" +
    '<div class="typeline">' + esc(roomTypeLine(c)) + "</div></div></div>" +
    flavorBlock(c) +
    '<div class="thresholds">' + challenges + "</div>" + foot + "</div>";
}

function cardHTML(c) {
  return c.kind === "room" || c.kind === "stairwell" ? roomCardHTML(c) : playerCardHTML(c);
}

/* The sheet's groupings, in cutting order — the cards print as one unbroken
   grid, but stay grouped so like cards land near each other. */
function player(owner, starter) {
  return function (c) {
    return c.kind === "player" && c.owner === owner && Boolean(c.starter) === starter;
  };
}
function kind(k) {
  return function (c) { return c.kind === k; };
}
function rewards(c) {
  return c.kind === "player" && !c.starter;
}

var SECTIONS = [
  { pick: player("Red", true) },
  { pick: player("Gray", true) },
  { pick: function (c) { return rewards(c) && c.owner === "Red"; } },
  { pick: function (c) { return rewards(c) && c.owner === "Gray"; } },
  { pick: kind("good_stuff") },
  { pick: kind("bad_stuff") },
  { pick: kind("stairwell") },
  { pick: kind("room") }
];

/* Physical playtesting needs duplicates: a card with `count` prints that many copies. */
function expand(cards) {
  var out = [];
  cards.forEach(function (c) {
    var n = c.count || 1;
    for (var i = 0; i < n; i++) out.push(c);
  });
  return out;
}

(function render() {
  var out = "", seen = 0;
  SECTIONS.forEach(function (s) {
    var cards = NVU_CARDS.cards.filter(s.pick);
    seen += cards.length;
    out += expand(cards).map(cardHTML).join("");
  });
  document.getElementById("sheets").innerHTML = '<div class="sheet">' + out + "</div>";

  /* Loud, on the page, if a card in the list reaches no section. */
  if (seen !== NVU_CARDS.cards.length) {
    var missed = NVU_CARDS.cards.filter(function (c) {
      return !SECTIONS.some(function (s) { return s.pick(c); });
    }).map(function (c) { return c.name; });
    document.getElementById("sheets").insertAdjacentHTML("afterbegin",
      "<h2 style=\"color:#b00\">" + missed.length +
      " card(s) on no section: " + esc(missed.join(", ")) + "</h2>");
  }
})();
</script>

</body>
</html>
